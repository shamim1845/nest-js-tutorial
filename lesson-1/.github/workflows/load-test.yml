name: Load Testing with k6

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_duration:
        description: 'Test duration in seconds'
        required: false
        default: '60'
        type: string
      virtual_users:
        description: 'Number of virtual users'
        required: false
        default: '10'
        type: string

jobs:
  load-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Start Minikube and deploy app
      uses: medyagh/kubectl-action@v1.2.0
      with:
        run: |
          minikube start --driver=docker
          minikube addons enable ingress
          minikube addons enable metrics-server
          eval $(minikube docker-env)
          docker build -t nestjs-app:latest ./lesson-1
          kubectl apply -f lesson-1/k8s/
          kubectl rollout status deployment/nestjs-app-deployment -n nestjs-app --timeout=300s

    - name: Wait for application to be ready
      run: |
        sleep 60
        kubectl wait --for=condition=ready pod -l app=nestjs-app -n nestjs-app --timeout=300s

    - name: Run k6 load tests
      uses: grafana/k6-action@v0.3.1
      with:
        filename: lesson-1/k6-tests/load-test.js
        cloud: false
        summary-export: test-results.json
      env:
        K6_DURATION: ${{ github.event.inputs.test_duration || '60' }}s
        K6_VUS: ${{ github.event.inputs.virtual_users || '10' }}
        BASE_URL: http://$(minikube ip):30080

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: k6-test-results
        path: test-results.json

    - name: Comment PR with results
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          try {
            const results = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
            const comment = `## 🚀 Load Test Results
            
            **Test Configuration:**
            - Duration: ${process.env.K6_DURATION || '60s'}
            - Virtual Users: ${process.env.K6_VUS || '10'}
            
            **Results:**
            - Total Requests: ${results.metrics.http_reqs?.values?.count || 'N/A'}
            - Failed Requests: ${results.metrics.http_req_failed?.values?.pct || 'N/A'}%
            - Average Response Time: ${results.metrics.http_req_duration?.values?.avg || 'N/A'}ms
            - 95th Percentile: ${results.metrics.http_req_duration?.values?.['p(95)'] || 'N/A'}ms
            
            **Performance Status:** ${results.metrics.http_req_failed?.values?.pct < 5 ? '✅ PASS' : '❌ FAIL'}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('Could not parse test results:', error);
          }
